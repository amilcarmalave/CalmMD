<!doctype html>
<!-- The README and social banner. Rendered to docs/screenshots/banner.png by scripts/banner.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden; position: relative;
    font-family: Inter, 'Segoe UI', system-ui, sans-serif; color: #e9ecf2;
    background:
      radial-gradient(55% 60% at 85% 0%, rgba(232, 162, 59, 0.32), transparent 70%),
      radial-gradient(45% 55% at 0% 40%, rgba(96, 129, 214, 0.28), transparent 70%),
      linear-gradient(180deg, #121a2c, #1f2a44);
  }
  body::before {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: linear-gradient(90deg, #000, transparent 70%);
  }
  .copy { position: absolute; left: 80px; top: 120px; width: 520px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 26px; color: #fff; }
  .brand img { width: 52px; height: 52px; border-radius: 13px; box-shadow: 0 0 0 1px rgba(255,255,255,0.14); }
  h1 { margin: 40px 0 0; font: 600 96px/0.98 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; letter-spacing: -0.035em; color: #fff; }
  h1 em { background: linear-gradient(100deg, #f6c46f, #e8a23b 60%, #e07b39); -webkit-background-clip: text; color: transparent; }
  p { margin: 28px 0 0; font-size: 23px; line-height: 1.5; color: rgba(233,236,242,0.78); }
  .tags { margin-top: 30px; display: flex; gap: 10px; }
  .tags span { padding: 7px 15px; border-radius: 999px; font-size: 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); }
  .shot { position: absolute; left: 640px; top: 96px; width: 900px; border-radius: 14px; overflow: hidden;
    box-shadow: 0 40px 90px -20px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.14); }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../assets/brand/calmmd-mark.svg" alt=""> CalmMD</div>
    <h1>Markdown,<br><em>calmly.</em></h1>
    <p>A free, open-source Markdown editor. Live preview, beautiful PDFs, plain files.</p>
    <div class="tags"><span>Windows</span><span>macOS</span><span>Linux</span><span>MIT</span></div>
  </div>
  <div class="shot"><img src="../docs/screenshots/live-light.png" alt=""></div>
</body>
</html>
