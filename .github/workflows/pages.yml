name: Website

# Builds the website (npm run site → dist-site/) and publishes it to GitHub Pages.
# Turn it on in the repository settings: Pages → Source: GitHub Actions. A custom domain
# (calmmd.app) is set there too.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/screenshots/**', 'docs/samples/**', 'packaging/install.*', 'scripts/build-site.mjs']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      - id: deployment
        uses: actions/deploy-pages@v4
